; ========================================================================================
;  MouseHK Configuration (v1.2)
; ========================================================================================
;  This file is the PRIMARY method for configuring the script.
;  If this file exists, the script will use these values.
;  If this file is deleted or lost, the script will use an internal backup configuration (WASD).
;
;  Changes take effect upon reloading the script (Default: Ctrl+Shift+Alt+Win+F5).
; ========================================================================================

[Movement]
; Base cursor speed (pixels per cycle)
BaseSpeed=2
; Maximum speed the cursor can reach with acceleration
MaxSpeed=35
; Acceleration factor (higher values = reaches max speed faster)
Acceleration=1.5
; Speed in Precision Mode (Shift held down)
PrecisionSpeed=4

[Scroll]
; Scroll delay (lower values = faster scrolling)
ScrollDelay=6

[Controls]
; Key assignments for movement and clicks.
; FORMAT: Key1 | Key2 | Key3
; - Use the pipe character (|) to assign multiple keys to the same action.
; - Key names must be valid AutoHotkey keys (e.g., a, b, Space, Numpad0).
;
; Examples:
; Up=w | Up  (Move with W or Arrow Up)
; LeftClick=e | NumpadEnter (Click with E or Numpad Enter)

; Cursor Movement
Up=W | O
Down=S | L
Left=A | K
Right=D | ; | Ñ

; Mouse Clicks
LeftClick=E | I
RightClick=Q | P
MiddleClick=F | J
; Extra Buttons (Back/Forward)
Button4=
Button5=

[BehaviorModifiers]
; --- Behavior Modifiers (Hold Key to Activate Mode) ---
; These keys change how the mouse behaves while you hold them down.

; PrecisionMode: Drastically slows down the cursor for pixel-perfect aiming.
; Default: Shift
PrecisionMode = Shift

; ScrollMode: Turns your movement keys (Up/Down/Left/Right) into a scroll wheel.
; Default: Space
ScrollMode = Space

; ClickHolder: "Drag Mode". While holding this key, clicking a mouse button will
; lock it in the "Down" position (for dragging files/windows). Click again to release.
; Default: Shift
ClickHolder = Shift

[Options]
; SuppressKeys: Controls if mouse keys are disabled for typing when active.
; 1 = Enabled (Keys DO NOT type letters when mouse mode is ON)
; 0 = Disabled (Keys type letters AND move mouse simultaneously)
SuppressKeys=1

; StartActive: Controls if the script starts in Active mode.
; 1 = Start Active (Mouse Mode ON)
; 0 = Start Suspended (Mouse Mode OFF)
StartActive=0

[Hotkeys]
; Unified Hotkey Configuration.
; Format: Modifier + Key | Alternative
; Valid Modifiers: Ctrl, Shift, Alt, Win
;
; Numpad Key Names:
; Numpad0..9, NumpadDot (.), NumpadDiv (/), NumpadMult (*),
; NumpadAdd (+), NumpadSub (-), NumpadEnter (Enter)
;
; You can combine keys (e.g., T + F) or modifiers (e.g., Ctrl + Alt).

; Toggle Mouse Mode ON/OFF
; You can also use Lock Keys state: CapsLock OFF, NumLock ON, ScrollLock OFF.
ToggleMouse = Shift + Space

; Reload Script (Emergency)
ReloadScript = Ctrl + Shift + Alt + Win + F5
